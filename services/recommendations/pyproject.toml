[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recommendations"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.3",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "psycopg[binary]==3.3.4",
  "pgvector==0.5.0",
  "sentence-transformers==5.7.0",
  "anthropic==0.122.0",
  "httpx==0.28.1",
  # torch has no macOS x86_64 wheel past 2.2.2, which predates NumPy 2.0's
  # C-ABI changes and silently breaks against it (torch's NumPy integration
  # fails to initialize, cascading into NameError deep inside transformers).
  # Scoped to Intel Macs only — other platforms resolve a current torch and
  # don't need this constraint.
  "numpy==1.26.4; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  # scipy>=1.14 requires numpy>=2.0, directly conflicting with the pin above
  # (scikit-learn, pulled in transitively by sentence-transformers, pulls in
  # scipy). Same Intel-Mac-only scope.
  "scipy==1.13.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  # transformers>=4.50ish hard-requires torch>=2.5 and (buggily) still
  # references torch.autograd at import time even after "disabling" torch
  # support for an older version, crashing instead of degrading gracefully.
  "transformers==4.44.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
